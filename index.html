<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}

    background:linear-gradient(180deg,#ffe7f4 0%,#d6ecff 100%);}
  #bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
  /* countdown clock - top right */

    display:none;align-items:center;justify-content:center;}

  #clockNum{position:relative;font-size:7vmin;font-weight:bold;color:#a24bbf;z-index:2;}
  #itemWrap{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%) scale(0);
    transition:transform .45s cubic-bezier(.3,1.5,.5,1);z-index:10;text-align:center;}
  #itemWrap.show{transform:translate(-50%,-50%) scale(1);}
  #itemWrap img{width:64vmin;max-width:80vw;height:auto;filter:drop-shadow(0 10px 18px rgba(0,0,0,.3));
    animation:bob 2.6s ease-in-out infinite;}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2.2vmin)}}
  #qText{position:absolute;left:50%;top:8%;transform:translateX(-50%);z-index:10;
    font-size:8vmin;color:#a24bbf;text-shadow:0 3px 0 #fff;white-space:nowrap;display:none;}
  #ansName{position:absolute;left:50%;top:76%;transform:translateX(-50%) scale(0);z-index:10;
    transition:transform .35s cubic-bezier(.3,1.5,.5,1);
    background:#fff;color:#7a3fa0;padding:1.6vmin 6vmin;border-radius:999px;
    font-size:7.5vmin;font-weight:bold;box-shadow:0 4px 14px rgba(0,0,0,.25);}
  #ansName.show{transform:translateX(-50%) scale(1);}
  #muteBtn{position:absolute;top:2vmin;left:2.4vmin;z-index:30;font-size:6vmin;cursor:pointer;
    background:rgba(255,255,255,.85);border:none;border-radius:50%;width:11vmin;height:11vmin;}
  #start{position:absolute;inset:0;z-index:50;display:flex;flex-direction:column;gap:3vmin;
    align-items:center;justify-content:center;text-align:center;padding:4vmin;
    background:linear-gradient(180deg,rgba(255,231,244,.96),rgba(214,236,255,.96));}
  #start h1{font-size:9vmin;color:#a24bbf;text-shadow:0 3px 0 #fff;}
  #start p{font-size:4.2vmin;color:#6b5b95;}
  #playBtn{font-size:7vmin;padding:2vmin 8vmin;border:none;border-radius:999px;cursor:pointer;
    background:linear-gradient(180deg,#9ad5ff,#5ab5f5);color:#fff;
    box-shadow:0 6px 0 #3a8ec7;animation:pulse 1.6s ease-in-out infinite;}
  @keyframes pulse{0%,100%{transform:scale(1);}50%{transform:scale(1.06);}}
</style>

/* ================= AUDIO ================= */
let musicOn = true, actx = null;
function ensureAudio(){ if(!actx){ try{ actx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } }
function speak(text, opts, onend){
  try{
    const vs = speechSynthesis.getVoices();
    const FEMALE = /(female|woman|zira|samantha|karen|google uk english female|google us english)/i;
    const MALE = /(male|david|daniel|alex|fred)/i;
    const v = vs.find(v=>FEMALE.test(v.name)) || vs.find(v=>!MALE.test(v.name)) || null;
    const u = new SpeechSynthesisUtterance(text);
    if(v) u.voice = v;
    u.rate = (opts&&opts.rate)||1.0; u.pitch = (opts&&opts.pitch)||1.35;
    let done=false;
    const fin=()=>{ if(done)return; done=true; if(onend) onend(); };
    u.onend = fin; u.onerror = fin;
    speechSynthesis.speak(u);
    setTimeout(fin, Math.max(2500, text.length*95));   /* mobile ended-fallback */
  }catch(e){ if(onend) setTimeout(onend,800); }
}
let musicTimer=null;
function playMusic(){ /* soft lullaby loop via notes */
  const notes=[523.25,659.25,783.99,659.25,587.33,698.46,880,698.46];
  let i=0;
  if(!actx) return;
  function note(){
    if(!musicOn) return;
    const o=actx.createOscillator(), g=actx.createGain();
    o.type="sine"; o.frequency.value=notes[i%notes.length];
    g.gain.setValueAtTime(.04, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(.001, actx.currentTime+1.1);
    o.connect(g); g.connect(actx.destination);
    o.start(); o.stop(actx.currentTime+1.2);
    i++;
    musicTimer=setTimeout(note, 900);
  }
  note();
}
function ding(){ if(!actx)return; const o=actx.createOscillator(),g=actx.createGain();
  o.type="triangle";o.frequency.value=880;g.gain.setValueAtTime(.08,actx.currentTime);
  g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+.5);
  o.connect(g);g.connect(actx.destination);o.start();o.stop(actx.currentTime+.5);}
function tick(final){ if(!actx)return; const o=actx.createOscillator(),g=actx.createGain();
  o.type="square";o.frequency.value=final?1200:700;g.gain.setValueAtTime(.05,actx.currentTime);
  g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+.18);
  o.connect(g);g.connect(actx.destination);o.start();o.stop(actx.currentTime+.2);}
function fanfare(){ if(!actx)return; [523,659,784,1047].forEach((f,i)=>{
  const o=actx.createOscillator(),g=actx.createGain();
  o.type="triangle";o.frequency.value=f;
  const t=actx.currentTime+i*.12;
  g.gain.setValueAtTime(.07,t);g.gain.exponentialRampToValueAtTime(.001,t+.45);
  o.connect(g);g.connect(actx.destination);o.start(t);o.stop(t+.5);});}

/* ================= GAME LOOP ================= */
const CIRC = 263.9;
let playing=false, roundN=0;
const $ = id=>document.getElementById(id);

function startRound(){
  if(!playing) return;
  roundN++;
  const w = WORDS[Math.floor(Math.random()*WORDS.length)];
  /* 1) ask the question */
  $("qText").style.display = "block";
  speak("What is this?", {rate:.95, pitch:1.4}, ()=>{
    if(!playing) return;
    /* 2) show the item */
    $("itemImg").src = w.img + "?v=2";
    $("itemWrap").classList.add("show");
    startClock(10, ()=>{
      /* 4) time up: wait 2s then reveal */
      setTimeout(()=>{
        if(!playing) return;
        $("ansName").textContent = w.name;
        $("ansName").classList.add("show");
        fanfare();
        speak(w.name + "!", {rate:.9, pitch:1.45}, ()=>{
          /* 5) vanish and loop */
          $("ansName").classList.remove("show");
          $("itemWrap").classList.remove("show");
          setTimeout(startRound, 1400);
        });
      }, 2000);
    });
  });
}

/* countdown clock with tick sounds */
function startClock(secs, onDone){
  const clock=$("clock"); clock.style.display="flex";
  let left=secs;
  $("clockNum").textContent=left;
  $("arc").style.strokeDashoffset="0";
  $("arc").style.stroke="#ff6fb5";
  tick(false);
  const t0=Date.now();
  const iv=setInterval(()=>{
    const el=(Date.now()-t0)/1000;
    left=Math.ceil(secs-el);
    if(left<0){clearInterval(iv);clock.style.display="none";onDone();return;}
    $("clockNum").textContent=left;
    $("arc").style.strokeDashoffset=(CIRC*(1-(secs-el)/secs)).toFixed(1);
    if(left<=3){ $("arc").style.stroke="#ff4d4d"; tick(true); } else tick(false);
  },1000);
}

/* ================= START ================= */
$("playBtn").addEventListener("click", ()=>{
  $("start").style.display="none";
  ensureAudio(); playMusic();
  playing=true;
  setTimeout(startRound, 800);
});
$("muteBtn").addEventListener("click", ()=>{
  musicOn=!musicOn;
  $("muteBtn").textContent = musicOn?"🎵":"🔇";
  if(!musicOn){ clearTimeout(musicTimer); if(window.speechSynthesis) speechSynthesis.cancel(); }
  else playMusic();
});
window.addEventListener("pointerdown", ()=>ensureAudio(), {once:true});
function fitBg(){
  document.getElementById("bg").src = matchMedia("(orientation:landscape)").matches
    ? "img/bg_clean_wide.png" : "img/bg_clean.png";
}
fitBg(); addEventListener("resize", fitBg);
